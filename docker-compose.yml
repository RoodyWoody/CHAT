services:

  postgres:
    image: postgres:17.5
    container_name: postgres_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
      - ./initdb:/docker-entrypoint-initdb.d
      - ./postgres:/data
      - ./backups:/backups
    tty: true
    stdin_open: true
  
  boost:
    image: boost:1.88.0
    container_name: boost_container
    restart: unless-stopped
    build:
      context: ./boost
      dockerfile: boost.Dockerfile
    hostname: host
    ports:
      - "8080:8080"
    tty: true
  
  python:
    image: python:3.10-slim
    container_name: python_container
    restart: unless-stopped
    ports:
      - "5431:5432"
    entrypoint: [ "bash", "-c", "pip install psycopg2-binary==2.9.10'"]      
  
  server:
    image: server:1.0
    container_name: server_container
    build:
      context: ./server
      dockerfile: server.Dockerfile
    depends_on:
      - python
      - postgres
      - boost
    ports:
      - "12340:12345" 
    volumes:
      - ./server:/server/data

  client:
    image: client:1.0
    container_name: client_container
    build:
      context: ./client
      dockerfile: client.Dockerfile
    depends_on:
      - boost
    ports:
      - "12341:12345"
    stdin_open: true
    tty: true
    volumes:
      - ./client:/client/data


volumes:
  pgdata:
    driver: local
  backups:
    driver: local